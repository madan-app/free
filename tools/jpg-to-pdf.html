<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPG to PDF — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>JPG to PDF</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><b>Select images</b><br><input id="files" type="file" accept="image/*" multiple></div>
<div class="row" style="margin-top:18px"><label>Page size <select id="size"><option>A4</option><option>A3</option><option>Letter</option><option>Legal</option></select></label><label>Orientation <select id="ori"><option>Portrait</option><option>Landscape</option></select></label><button class="btn" id="go">Create PDF</button></div><div id="list" class="files"></div><div id="status" class="status"></div>
<script>
const f=document.getElementById('files'),list=document.getElementById('list'); f.onchange=()=>list.innerHTML=[...f.files].map(x=>`<div class="file-item">${x.name} · ${DOCU.fmt(x.size)}</div>`).join('');
document.getElementById('go').onclick=async()=>{if(!f.files.length)return alert('Choose images first');let {PDFDocument}=await DOCU.pdfLib();let pdf=await PDFDocument.create();let sizes={A4:[595.28,841.89],A3:[841.89,1190.55],Letter:[612,792],Legal:[612,1008]};let [w0,h0]=sizes[document.getElementById('size').value];if(document.getElementById('ori').value==='Landscape')[w0,h0]=[h0,w0];for(let file of f.files){let b=await file.arrayBuffer(),im=file.type==='image/png'?await pdf.embedPng(b):await pdf.embedJpg(b),p=pdf.addPage([w0,h0]),scale=Math.min((w0-40)/im.width,(h0-40)/im.height),w=im.width*scale,h=im.height*scale;p.drawImage(im,{x:(w0-w)/2,y:(h0-h)/2,width:w,height:h})}DOCU.download(new Blob([await pdf.save()],{type:'application/pdf'}),'images.pdf');document.getElementById('status').textContent='PDF created successfully.'};
</script></div></main></body></html>
