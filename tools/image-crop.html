<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crop Image — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Crop Image</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="image/*"></div><p>Enter crop rectangle in pixels.</p><div class="row"><input id="x" type="number" value="0" placeholder="X"><input id="y" type="number" value="0" placeholder="Y"><input id="w" type="number" placeholder="Width"><input id="h" type="number" placeholder="Height"><button class="btn" id="go">Crop</button></div><div id="status" class="status"></div>
<script>
let im=new Image();file.onchange=()=>im.onload=()=>{w.value=im.naturalWidth;h.value=im.naturalHeight},im.src=URL.createObjectURL(file.files[0]);go.onclick=()=>{if(!im.src)return alert('Choose image');let c=document.createElement('canvas');c.width=+w.value;c.height=+h.value;c.getContext('2d').drawImage(im,+x.value,+y.value,+w.value,+h.value,0,0,c.width,c.height);c.toBlob(b=>DOCU.download(b,'cropped.jpg'),'image/jpeg',.92)}
</script></div></main></body></html>
