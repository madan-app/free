<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotate Image — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Rotate Image</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="image/*"></div><div class="row" style="margin-top:18px"><label>Rotation <select id="deg"><option>90</option><option>180</option><option>270</option></select></label><button class="btn" id="go">Rotate</button></div><div id="status" class="status"></div>
<script>
go.onclick=()=>{let f=file.files[0];if(!f)return alert('Choose image');let im=new Image();im.onload=()=>{let d=+deg.value,c=document.createElement('canvas'),swap=d%180!==0;c.width=swap?im.naturalHeight:im.naturalWidth;c.height=swap?im.naturalWidth:im.naturalHeight;let g=c.getContext('2d');g.translate(c.width/2,c.height/2);g.rotate(d*Math.PI/180);g.drawImage(im,-im.naturalWidth/2,-im.naturalHeight/2);c.toBlob(b=>DOCU.download(b,'rotated.jpg'),'image/jpeg',.92)};im.src=URL.createObjectURL(f)}
</script></div></main></body></html>
