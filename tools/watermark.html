<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watermark PDF — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Watermark PDF</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="application/pdf"></div><div class="row" style="margin-top:18px"><input id="text" type="text" value="CONFIDENTIAL" placeholder="Watermark text"><label>Opacity <input id="op" type="number" min=".05" max="1" step=".05" value=".25"></label><button class="btn" id="go">Add Watermark</button></div><div id="status" class="status"></div>
<script>
document.getElementById('go').onclick=async()=>{let f=file.files[0],t=text.value;if(!f||!t)return alert('Choose a PDF and enter text');let {PDFDocument,rgb,degrees}=await DOCU.pdfLib(),pdf=await PDFDocument.load(await f.arrayBuffer()),o=Math.max(.05,Math.min(1,Number(op.value)||.25));pdf.getPages().forEach(p=>{let {width,height}=p.getSize();p.drawText(t,{x:width/2-80,y:height/2,size:42,opacity:o,color:rgb(.35,.35,.4),rotate:degrees(35)})});DOCU.download(new Blob([await pdf.save()],{type:'application/pdf'}),'watermarked.pdf');status.textContent='Watermark added.'};
</script></div></main></body></html>
