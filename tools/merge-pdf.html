<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge PDF — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Merge PDF</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><b>Select PDF files in the order you want</b><br><input id="files" type="file" accept="application/pdf" multiple></div><button class="btn" id="go" style="margin-top:18px">Merge PDFs</button><div id="status" class="status"></div>
<script>
document.getElementById('go').onclick=async()=>{let fs=[...document.getElementById('files').files];if(!fs.length)return alert('Choose PDFs');let {PDFDocument}=await DOCU.pdfLib();let out=await PDFDocument.create();for(let f of fs){let src=await PDFDocument.load(await f.arrayBuffer());let pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}DOCU.download(new Blob([await out.save()],{type:'application/pdf'}),'merged.pdf');status.textContent='Merged successfully.'};
</script></div></main></body></html>
