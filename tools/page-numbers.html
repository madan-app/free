<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page Numbers — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Page Numbers</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="application/pdf"></div><div class="row" style="margin-top:18px"><label>Position <select id="pos"><option>Bottom center</option><option>Bottom right</option><option>Bottom left</option></select></label><button class="btn" id="go">Add Page Numbers</button></div><div id="status" class="status"></div>
<script>
document.getElementById('go').onclick=async()=>{let f=file.files[0];if(!f)return alert('Choose PDF');let {PDFDocument, rgb}=await DOCU.pdfLib(),pdf=await PDFDocument.load(await f.arrayBuffer()),ps=pdf.getPages();ps.forEach((p,i)=>{let {width}=p.getSize(),s=`${i+1}`;let x=width/2-5;if(pos.value==='Bottom right')x=width-35;if(pos.value==='Bottom left')x=20;p.drawText(s,{x,y:18,size:10,color:rgb(.25,.25,.25)})});DOCU.download(new Blob([await pdf.save()],{type:'application/pdf'}),'numbered.pdf');status.textContent='Page numbers added.'};
</script></div></main></body></html>
