<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convert Image — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Convert Image</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="image/*"></div><div class="row" style="margin-top:18px"><label>Output <select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label><button class="btn" id="go">Convert</button></div><div id="status" class="status"></div>
<script>
go.onclick=()=>{let f=file.files[0];if(!f)return alert('Choose image');let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);let ext=fmt.value.split('/')[1];c.toBlob(b=>DOCU.download(b,`converted.${ext}`),fmt.value,.92)};im.src=URL.createObjectURL(f)}
</script></div></main></body></html>
