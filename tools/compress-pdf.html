<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compress PDF — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Compress PDF</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="application/pdf"></div><p class="note">This browser-side optimizer rebuilds the document and removes unused PDF objects where possible. Image-heavy PDFs may not shrink dramatically.</p><button class="btn" id="go">Optimize PDF</button><div id="status" class="status"></div>
<script>
document.getElementById('go').onclick=async()=>{let f=file.files[0];if(!f)return alert('Choose a PDF');let {PDFDocument}=await DOCU.pdfLib();let src=await PDFDocument.load(await f.arrayBuffer()),out=await PDFDocument.create();let pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p));let b=await out.save({useObjectStreams:true});DOCU.download(new Blob([b],{type:'application/pdf'}),'optimized.pdf');status.textContent=`Original: ${DOCU.fmt(f.size)}\nOptimized: ${DOCU.fmt(b.length)}`};
</script></div></main></body></html>
