<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protect PDF — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Protect PDF</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="application/pdf"></div><p class="note danger"><b>Important:</b> True PDF password encryption is not supported by pdf-lib. This tool does not falsely claim to encrypt your PDF. Use a trusted desktop PDF editor for password encryption.</p><button class="btn" id="go">Create Copy</button><div id="status" class="status"></div>
<script>go.onclick=async()=>{let f=file.files[0];if(!f)return alert('Choose a PDF');let b=await f.arrayBuffer();DOCU.download(new Blob([b],{type:'application/pdf'}),'pdf-copy.pdf');status.textContent='A copy was created. No password encryption was applied.'}</script></div></main></body></html>
