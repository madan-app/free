<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organize PDF — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Organize PDF</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="application/pdf"></div><p>Use a page order such as <b>3,1,2,4</b>. You can also omit pages.</p><input id="order" type="text" placeholder="3,1,2,4" style="width:min(500px,100%)"><button class="btn" id="go">Create Organized PDF</button><div id="status" class="status"></div>
<script>
document.getElementById('go').onclick=async()=>{let f=file.files[0];if(!f)return alert('Choose PDF');let {PDFDocument}=await DOCU.pdfLib(),src=await PDFDocument.load(await f.arrayBuffer()),order=document.getElementById('order').value.split(',').map(x=>Number(x.trim())-1).filter(x=>x>=0&&x<src.getPageCount());if(!order.length)return alert('Enter a page order');let out=await PDFDocument.create();(await out.copyPages(src,order)).forEach(p=>out.addPage(p));DOCU.download(new Blob([await out.save()],{type:'application/pdf'}),'organized.pdf');status.textContent='Done.'};
</script></div></main></body></html>
