<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotate PDF — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Rotate PDF</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="application/pdf"></div><div class="row" style="margin-top:18px"><label>Rotation <select id="deg"><option>90</option><option>180</option><option>270</option></select> degrees</label><button class="btn" id="go">Rotate PDF</button></div><div id="status" class="status"></div>
<script>
document.getElementById('go').onclick=async()=>{let f=file.files[0];if(!f)return alert('Choose a PDF');let {PDFDocument,degrees}=await DOCU.pdfLib(),pdf=await PDFDocument.load(await f.arrayBuffer()),d=Number(deg.value);pdf.getPages().forEach(p=>p.setRotation(degrees(d)));DOCU.download(new Blob([await pdf.save()],{type:'application/pdf'}),'rotated.pdf');status.textContent='PDF rotated.'};
</script></div></main></body></html>
