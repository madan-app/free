<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compress Image — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Compress Image</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="image/*"></div><div class="row" style="margin-top:18px"><label>Quality <input id="q" type="number" min=".1" max="1" step=".05" value=".75"></label><label>Format <select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select></label><button class="btn" id="go">Compress</button></div><div id="status" class="status"></div>
<script>
go.onclick=async()=>{let f=file.files[0];if(!f)return alert('Choose image');let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);c.toBlob(b=>{DOCU.download(b,`compressed.${fmt.value==='image/png'?'png':fmt.value==='image/webp'?'webp':'jpg'}`);status.textContent=`Original ${DOCU.fmt(f.size)} → ${DOCU.fmt(b.size)}`},fmt.value,Number(q.value))};im.src=URL.createObjectURL(f)}
</script></div></main></body></html>
