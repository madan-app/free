<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to JPG — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>PDF to JPG</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="application/pdf"></div><div class="row" style="margin-top:18px"><label>Quality <input id="q" type="number" min=".5" max="1" step=".05" value=".92"></label><button class="btn" id="go">Convert Pages</button></div><div id="preview" class="preview"></div><div id="status" class="status"></div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs'; pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.mjs';
document.getElementById('go').onclick=async()=>{let f=file.files[0];if(!f)return alert('Choose PDF');status.textContent='Rendering...';let pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;preview.innerHTML='';for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),v=p.getViewport({scale:1.5}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;preview.appendChild(c);let a=document.createElement('a');a.className='btn secondary';a.textContent=`Download page ${i}`;a.onclick=()=>c.toBlob(b=>DOCU.download(b,`page-${i}.jpg`),'image/jpeg',Number(q.value));preview.appendChild(a)}status.textContent=`${pdf.numPages} page(s) rendered. Click each Download button.`};
</script></div></main></body></html>
