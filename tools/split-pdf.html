<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Split PDF — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Split PDF</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="application/pdf"></div>
<p>Enter pages/ranges, e.g. <b>1,3,5-7</b>. The selected pages will be exported as one PDF.</p><input id="pages" type="text" placeholder="1,3,5-7" style="width:min(500px,100%)"><button class="btn" id="go">Extract Pages</button><div id="status" class="status"></div>
<script>
function parse(s,max){let a=[];for(let x of s.split(',')){x=x.trim();if(!x)continue;if(x.includes('-')){let [u,v]=x.split('-').map(Number);for(let i=u;i<=v;i++)if(i>=1&&i<=max)a.push(i-1)}else{let i=Number(x);if(i>=1&&i<=max)a.push(i-1)}}return [...new Set(a)]}
document.getElementById('go').onclick=async()=>{let f=document.getElementById('file').files[0];if(!f)return alert('Choose a PDF');let {PDFDocument}=await DOCU.pdfLib(),src=await PDFDocument.load(await f.arrayBuffer()),ids=parse(document.getElementById('pages').value,src.getPageCount());if(!ids.length)return alert('Enter valid pages');let out=await PDFDocument.create();(await out.copyPages(src,ids)).forEach(p=>out.addPage(p));DOCU.download(new Blob([await out.save()],{type:'application/pdf'}),'split.pdf');status.textContent='Selected pages exported.'};
</script></div></main></body></html>
