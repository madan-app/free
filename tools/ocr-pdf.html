<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR PDF — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>OCR PDF</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="application/pdf,image/*"></div><p class="note">OCR uses Tesseract.js in your browser. For large PDFs this can take time and requires downloading the OCR engine from a CDN.</p><label>Language <select id="lang"><option value="eng">English</option><option value="hin">Hindi</option><option value="tam">Tamil</option><option value="kan">Kannada</option></select></label><button class="btn" id="go">Run OCR</button><textarea id="out" style="width:100%;height:260px;margin-top:18px;padding:12px"></textarea><div id="status" class="status"></div>
<script type="module">
import {createWorker} from 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js';
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs'; pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.mjs';
document.getElementById('go').onclick=async()=>{let f=file.files[0];if(!f)return alert('Choose a PDF or image');status.textContent='Starting OCR...';let worker=await createWorker(lang.value);let images=[];if(f.type==='application/pdf'){let pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),v=p.getViewport({scale:1.5}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;images.push(c)}}else images=[f];let all='';for(let i=0;i<images.length;i++){status.textContent=`OCR page ${i+1}/${images.length}...`;let r=await worker.recognize(images[i]);all+=`\n--- Page ${i+1} ---\n${r.data.text}`}await worker.terminate();out.value=all.trim();status.textContent='OCR complete.'};
</script></div></main></body></html>
