<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resize Image — DocuCraft</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><span>DocuCraft</span></div><a href="../index.html">Home</a></header><main class="tool-page"><a class="back" href="../index.html">← All tools</a><h1>Resize Image</h1><p class="sub">Free browser-based processing.</p><div class="card">
<div class="drop"><input id="file" type="file" accept="image/*"></div><div class="row" style="margin-top:18px"><label>Width <input id="w" type="number" placeholder="px"></label><label>Height <input id="h" type="number" placeholder="px"></label><label><input id="keep" type="checkbox" checked> Keep ratio</label><button class="btn" id="go">Resize</button></div><div id="status" class="status"></div>
<script>
let img=new Image();file.onchange=()=>{img.onload=()=>{w.value=img.naturalWidth;h.value=img.naturalHeight};img.src=URL.createObjectURL(file.files[0])};w.oninput=()=>{if(keep.checked&&img.naturalWidth)h.value=Math.round(w.value*img.naturalHeight/img.naturalWidth)};h.oninput=()=>{if(keep.checked&&img.naturalHeight)w.value=Math.round(h.value*img.naturalWidth/img.naturalHeight)};go.onclick=()=>{if(!img.src)return alert('Choose image');let c=document.createElement('canvas');c.width=Number(w.value);c.height=Number(h.value);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>DOCU.download(b,'resized.jpg'),'image/jpeg',.92);status.textContent='Resized image created.'}
</script></div></main></body></html>
